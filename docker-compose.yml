# Pagemaster - multi-repo web hosting panel
# Works with: docker compose, TrueNAS SCALE (Apps > Discover > Custom App > Install via YAML),
# Portainer, Dockge, or Docker inside a Proxmox LXC/VM.
services:
  pagemaster:
    image: ghcr.io/nulljayden/pagemaster:latest
    # To build locally instead of pulling, comment `image` and uncomment:
    # build: .
    container_name: pagemaster
    restart: unless-stopped
    environment:
      - TZ=Etc/UTC
      - ADMIN_PORT=38080           # admin web UI
      - HOSTING_PORT=38081         # all sites: http://server:38081/<slug>/ (and Cloudflare tunnels)
      # - TRUST_PROXY=true         # set when behind a reverse proxy (Nginx Proxy Manager, Traefik, Caddy...)
      # - COOKIE_SECURE=true       # set when the admin UI is only reached over HTTPS
    ports:
      - "38080:38080"              # admin UI
      - "38081:38081"              # sites
      # - "8100-8199:8100-8199"    # only if you use dedicated site ports (Advanced)
    volumes:
      # TrueNAS: change to a dataset path, e.g. /mnt/tank/apps/pagemaster:/data
      - ./data:/data
      # If builds fail with "Permission denied" / code 126 (dataset with exec=off or
      # ACL mode "Restricted"), keep sites on a Docker volume instead:
      # - pagemaster-sites:/data/sites

# volumes:
#   pagemaster-sites:
